name: shorts
canvas:
  width: 1080
  height: 1920
  fps: 30
sources:
  main: ./demo/talk.mp4
ops:
  - op: cut_silence
    min_silence: 0.35
    pad: 0.08
  - op: reframe
    aspect: "9:16"
    mode: fill
  - op: captions
    burn: true
    style: boxed
  - op: loudnorm
    i: -13
  - op: export
    presets: [shorts_9x16]
