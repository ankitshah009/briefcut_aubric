[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vedit"
version = "1.2.0"
description = "Briefcut by Aubric, Inc.: local video editing with inspectable stories and spatial effects."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ankit Shah" }]
keywords = ["video", "ffmpeg", "nle", "editor", "captions", "meta", "mcp", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = [
    "mcp>=1.2",
]
sam = [
    "meta-sam-parser==0.1.0",
]

[project.scripts]
vedit = "vedit.cli:main"
briefcut = "vedit.cli:briefcut_main"

[dependency-groups]
# uv installs this group by default (`uv sync`, `uv run`); the `dev` extra above stays for pip users.
dev = [
    "mcp>=1.2",
    "meta-sam-parser==0.1.0",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14",
]

[tool.uv]
# uv owns the environment: `uv sync`, then `uv run vedit doctor` / `uv run pytest`.
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vedit = ["py.typed", "studio/static/*", "macos/*.swift", "assets/music/*.m4a", "assets/blender/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "render: needs a working ffmpeg",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "PL", "RUF", "BLE", "TRY", "C90", "PERF", "FURB", "ISC", "RET", "FLY", "PTH", "T20"]
ignore = [
    "E501",     # the formatter wraps code; strings and comments may run long
    "PLR2004",  # a video tool is made of numbers: sizes, rates, thresholds
    "PLR0913",  # ops take many named parameters on purpose
    "PLR0912", "PLR0915", "PLR0911",  # C901 is the one complexity gauge
    "PLC0415",  # lazy imports keep `vedit --help` fast and optional deps optional
    "TRY003",   # messages are written for the person reading them, not for exception classes
    "TRY300",   # a return inside try reads fine here
    "RUF012",   # mutable class attributes are used as constants
    "T201",     # the CLI prints by design
    "ISC001",   # conflicts with the formatter
    "RUF001", "RUF002", "RUF003",  # curly quotes and dashes in text people read are on purpose
    "PLR0917",  # ops and FFmpeg helpers take their positional parameters on purpose
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR", "C90", "BLE001", "PTH", "RUF", "SIM", "PERF", "B", "TRY", "FURB", "RET", "E741"]
"src/vedit/assets/blender/*" = ["PTH"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingModuleSource = false
