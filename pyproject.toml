[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vedit"
version = "1.2.0"
description = "Briefcut by Aubric, Inc.: local video editing with inspectable stories and spatial effects."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Ankit Shah" }]
keywords = ["video", "ffmpeg", "nle", "editor", "captions", "meta", "mcp", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = [
    "mcp>=1.2",
]
sam = [
    "meta-sam-parser==0.1.0",
]

[project.scripts]
vedit = "vedit.cli:main"
briefcut = "vedit.cli:briefcut_main"

[dependency-groups]
# uv installs this group by default (`uv sync`, `uv run`); the `dev` extra above stays for pip users.
dev = [
    "mcp>=1.2",
    "meta-sam-parser==0.1.0",
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
# uv owns the environment: `uv sync`, then `uv run vedit doctor` / `uv run pytest`.
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vedit = ["py.typed", "studio/static/*", "macos/*.swift", "assets/music/*.m4a", "assets/blender/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "render: needs a working ffmpeg",
]
